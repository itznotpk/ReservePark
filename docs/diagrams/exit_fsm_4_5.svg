<text x="100" y="860" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1F2A44" text-anchor="start">Ownership and key rules</text>
<text x="100" y="890" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#22915A" text-anchor="start">Gate RTL:</text>
<text x="250" y="890" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">EXIT_OPEN, EXIT_WAIT_PASS, the exit timestamp in EXIT_RECORD, EXIT_WAIT_CLEAR and the EXIT_CLOSE obstruction interlock.</text>
<text x="100" y="917" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#2F6FDE" text-anchor="start">Firmware:</text>
<text x="250" y="917" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">EXIT_WAIT_ACPR, EXIT_VALIDATE, the INSIDE_COUNT update and billing event in EXIT_RECORD, EXIT_FINALIZE and EXIT_DONE.</text>
<text x="100" y="944" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#22915A" text-anchor="start">Why RECORD first:</text>
<text x="250" y="944" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">exit time is captured at the crossing, so a later closing fault cannot lose the departure or lengthen the bill.</text>
<text x="100" y="971" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#D4930D" text-anchor="start">Bay release:</text>
<text x="250" y="971" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#4A5568" text-anchor="start">only with matching owner, confirmed departure and a healthy vacant sensor; otherwise flag a discrepancy.</text>
</svg>
